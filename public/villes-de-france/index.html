<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Cartes de géographie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout : une carte plein écran façon fiche de géo, barre de saisie qui flotte en haut de la carte, barre de validation collée en bas. */
:root {
  --paper: #F5F6F1;
  --ink: #1D3F8F;
  --ink-soft: #5B6B8C;
  --text: #1C2230;
  --sea: #D7E5EE;
  --land: #E6E8DF;
  --france: #FFFFFF;
  --border-other: #B9BEB0;
  --border-fr: #2A3550;
  --river: #6F9DC6;
  --dot: #1C2230;
  --dot-empty: #FFFFFF;
  --panel: #FFFFFF;
  --line: #D9DCD2;
  --ok: #23964A;
  --warn: #E3AE0B;
  --bad: #D33F3F;
  --halo: rgba(255,255,255,.85);
  --font-ui: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12161D; --ink: #93B1FF; --ink-soft: #8D98B0; --text: #E6E9F0;
  --sea: #142430; --land: #1E2329; --france: #2A313B; --border-other: #3A424C; --border-fr: #A9B6CF; --river: #4E7EA8;
  --dot: #E6E9F0; --dot-empty: #2A313B; --panel: #1B2029; --line: #313844; --halo: rgba(20,24,30,.85);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12161D; --ink: #93B1FF; --ink-soft: #8D98B0; --text: #E6E9F0;
  --sea: #142430; --land: #1E2329; --france: #2A313B; --border-other: #3A424C; --border-fr: #A9B6CF; --river: #4E7EA8;
  --dot: #E6E9F0; --dot-empty: #2A313B; --panel: #1B2029; --line: #313844; --halo: rgba(20,24,30,.85);
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--text); font-family: var(--font-ui); display: flex; flex-direction: column; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 8px; }
h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 span { color: var(--ink); }
.hint { margin: 0; font-size: .8rem; color: var(--ink-soft); }
.titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.switch { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.switch button { font: 600 .82rem var(--font-ui); border: 0; border-radius: 999px; padding: 7px 14px; background: transparent; color: var(--ink-soft); cursor: pointer; }
.switch button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.switch button:focus-visible { outline: 3px solid color-mix(in srgb, var(--ink) 50%, transparent); outline-offset: 1px; }

.mapwrap { position: relative; flex: 1 1 auto; min-height: 300px; margin: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--sea); }
svg#map { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
svg#map.dragging { cursor: grabbing; }
.other { fill: var(--land); stroke: var(--border-other); stroke-linejoin: round; }
.fr { fill: var(--france); stroke: var(--border-fr); stroke-linejoin: round; }
.inset { fill: none; stroke: var(--border-fr); opacity: .55; pointer-events: none; }
.river { fill: none; stroke: var(--river); stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.dot { fill: var(--dot); stroke: var(--france); }
.dot.empty { fill: var(--dot-empty); stroke: var(--dot); }
.dot.ok { fill: var(--ok); stroke: var(--france); }
.dot.warn { fill: var(--warn); stroke: var(--france); }
.dot.bad { fill: var(--bad); stroke: var(--france); }
.sel-ring { fill: none; stroke: var(--ink); }
.hit { fill: transparent; cursor: pointer; }
.lbl { font-family: var(--font-hand); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; pointer-events: none; }
.lbl.ok { fill: var(--ok); } .lbl.warn { fill: color-mix(in srgb, var(--warn) 70%, var(--text)); } .lbl.bad { fill: var(--bad); }

.zoom { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font: 600 1.2rem/1 var(--font-ui); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.zoom button.small { font-size: .7rem; }

.editor { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 8px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
.editor input { flex: 1 1 auto; min-width: 0; font: 1.35rem var(--font-hand); color: var(--ink); background: transparent;
  border: none; border-bottom: 2px solid var(--line); padding: 4px 4px 2px; outline: none; }
.editor input:focus { border-bottom-color: var(--ink); }
.btn { font: 600 .9rem var(--font-ui); border-radius: 8px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .zoom button:focus-visible { outline: 3px solid color-mix(in srgb, var(--ink) 50%, transparent); outline-offset: 2px; }

footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; }
.progress { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.progress .count { font-size: .85rem; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .25s; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--ink-soft); width: 100%; }
.legend i { font-style: normal; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; width: 100%; }
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10,14,22,.45);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
.modal { width: 100%; max-width: 340px; background: var(--panel); color: var(--text); border-radius: 14px; padding: 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 14px; animation: pop .22s ease-out; }
.modal h2 { margin: 0; font-size: 1.2rem; text-wrap: balance; }
.modal .bravo { font-family: var(--font-hand); font-size: 2.2rem; line-height: 1; color: var(--ok); margin: 0; }
.modal p { margin: 0; font-size: .9rem; color: var(--ink-soft); }
.scores { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.scores li { display: flex; align-items: center; gap: 10px; font-size: .92rem; }
.scores li b { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.scores li span { flex: 1 1 auto; min-width: 0; }
.scores li strong { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.modal .btn { align-self: stretch; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .modal { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1 id="mapTitle">Les grandes villes <span>françaises</span></h1>
    <p class="hint" id="mapHint">Touche un point et écris le nom de la ville.</p>
  </div>
  <div class="switch" role="tablist" aria-label="Choisir la carte">
    <button type="button" role="tab" data-map="france" id="tab-france">France</button>
    <button type="button" role="tab" data-map="royaume-uni" id="tab-royaume-uni">Royaume-Uni</button>
  </div>
</header>

<div class="mapwrap" id="mapwrap">
  <svg id="map" role="img" aria-label="Carte à compléter">
    <defs><clipPath id="landClip"><use href="#mainShape"/></clipPath></defs>
    <g id="world">
      <path class="other" id="otherShape"/>
      <path class="fr" id="mainShape"/>
      <path class="river" clip-path="url(#landClip)" id="riverShape"/>
      <path class="inset" id="insetShape"/>
      <g id="labels"></g>
      <g id="dots"></g>
      <text class="lbl" id="measure" x="-9999" y="-9999" style="font-size:15px" aria-hidden="true"></text>
    </g>
  </svg>
  <form class="editor" id="editor" hidden autocomplete="off">
    <input id="cityInput" type="text" placeholder="Nom de la ville" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Nom">
    <button type="submit" class="btn primary">OK</button>
  </form>
  <div class="zoom">
    <button type="button" id="zin" aria-label="Zoomer">+</button>
    <button type="button" id="zout" aria-label="Dézoomer">−</button>
    <button type="button" id="zreset" class="small" aria-label="Voir toute la carte">⤢</button>
  </div>
</div>

<footer>
  <div class="progress">
    <span class="count" id="count">0 / 38 villes</span>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <button type="button" class="btn" id="clearBtn">Effacer</button>
  <button type="button" class="btn primary" id="validateBtn" disabled>Valider</button>
  <div class="legend" id="legend" hidden>
    <span><b style="background:var(--ok)"></b>Juste</span>
    <span><b style="background:var(--warn)"></b>Bonne réponse, faute d'orthographe</span>
    <span><b style="background:var(--bad)"></b><i id="legendBad">Mauvaise ville</i></span>
  </div>
  <div class="confirm" id="confirmBox" hidden>
    <span>Effacer toutes les réponses de cette carte ?</span>
    <button type="button" class="btn" id="confirmNo">Annuler</button>
    <button type="button" class="btn primary" id="confirmYes">Tout effacer</button>
  </div>
</footer>

<div class="overlay" id="resultOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <p class="bravo" id="bravo" hidden>Bravo !</p>
    <h2 id="resultTitle">Résultat</h2>
    <ul class="scores">
      <li><b style="background:var(--ok)"></b><span>Justes</span><strong id="nOk">0</strong></li>
      <li><b style="background:var(--warn)"></b><span>Fautes d'orthographe</span><strong id="nWarn">0</strong></li>
      <li><b style="background:var(--bad)"></b><span id="badLabel">Mauvaises villes</span><strong id="nBad">0</strong></li>
    </ul>
    <p id="resultMsg"></p>
    <button type="button" class="btn primary" id="resultClose">Voir la carte</button>
  </div>
</div>

        { id: 3, name: "Glasgow", lat: 55.8642, lon: -4.2518, side: "l" },
        { id: 4, name: "Belfast", lat: 54.5973, lon: -5.9301 },
        { id: 5, name: "Liverpool", lat: 53.4084, lon: -2.9916, side: "l" },
        { id: 6, name: "Manchester", lat: 53.4808, lon: -2.2426, side: "t" },
        { id: 7, name: "Birmingham", lat: 52.4862, lon: -1.8904 },
        { id: 8, name: "Édimbourg", alts: ["Edimbourg", "Edinburgh"], lat: 55.9533, lon: -3.1883 },
        { id: 9, name: "Leeds", lat: 53.8008, lon: -1.5491 },
        { id: 10, name: "Douvres", alts: ["Dover"], lat: 51.1279, lon: 1.3134, side: "b" },
        { id: 11, name: "England", alts: ["Angleterre"], zone: true, lat: 52.25, lon: -0.6 },
        { id: 12, name: "Wales", alts: ["Pays de Galles", "pays de Galles"], zone: true, lat: 52.35, lon: -3.7, side: "l" },
        { id: 13, name: "Scotland", alts: ["Écosse", "Ecosse"], zone: true, lat: 57.1, lon: -4.4 },
        { id: 14, name: "Ulster", alts: ["Irlande du Nord"], zone: true, lat: 54.62, lon: -6.95, side: "l" }
      ]
    }
  };

  const svg = document.getElementById("map");
  const world = document.getElementById("world");
  const gDots = document.getElementById("dots");
  const gLabels = document.getElementById("labels");
  const editor = document.getElementById("editor");
  const input = document.getElementById("cityInput");
  const measureEl = document.getElementById("measure");
  const overlay = document.getElementById("resultOverlay");
  const confirmBox = document.getElementById("confirmBox");

  // ---- État de chaque carte ----
  Object.values(MAPS).forEach(m => {
    m.points.forEach(c => { [c.x, c.y] = m.proj(c.lon, c.lat); });
    m.answers = {}; m.results = {}; m.validated = false;
    try { const s = JSON.parse(localStorage.getItem(m.storeKey) || "null"); if (s && s.answers) m.answers = s.answers; } catch (e) {}
  });
  const save = m => { try { localStorage.setItem(m.storeKey, JSON.stringify({ answers: m.answers })); } catch (e) {} };

  let M = null, W = 0, H = 0, P = [], els = {}, current = null;
  let k = 1, tx = 0, ty = 0, placedK = null;
  const KMAX = 10;

  function loadMap(key) {
    const m = MAPS[key] || MAPS.france;
    if (M === m) return;
    if (M) { commit(); current = null; editor.hidden = true; }
    M = m; W = m.W; H = m.H; P = m.points;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    document.getElementById("otherShape").setAttribute("d", m.other);
    document.getElementById("mainShape").setAttribute("d", m.main);
    document.getElementById("riverShape").setAttribute("d", m.rivers || "M0 0");
    document.getElementById("insetShape").setAttribute("d", m.inset(m.proj, W, H));
    document.getElementById("mapTitle").innerHTML = m.title;
    document.getElementById("mapHint").textContent = m.hint;
    document.getElementById("legendBad").textContent = m.badOne;
    document.getElementById("badLabel").textContent = m.bad;
    document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.map === key)));
    gDots.textContent = ""; gLabels.textContent = ""; els = {};
    P.forEach(c => {
      const g = document.createElementNS(NS, "g");
      const ring = document.createElementNS(NS, "circle"); ring.setAttribute("class", "sel-ring"); ring.style.display = "none";
      ring.setAttribute("cx", c.x); ring.setAttribute("cy", c.y);
      const dot = document.createElementNS(NS, c.zone ? "rect" : "circle");
      if (!c.zone) { dot.setAttribute("cx", c.x); dot.setAttribute("cy", c.y); }
      g.append(ring, dot); gDots.appendChild(g);
      const t = document.createElementNS(NS, "text"); t.setAttribute("class", "lbl"); gLabels.appendChild(t);
      els[c.id] = { ring, dot, t };
    });
    k = 1; tx = 0; ty = 0; placedK = null;
    applyView(); render();
  }

  // ---- Vue (zoom / déplacement) ----
  function pxPerUnit() { const r = svg.getBoundingClientRect(); return Math.min(r.width / W, r.height / H) || 1; }
  function clampView() {
    k = Math.max(1, Math.min(KMAX, k));
    tx = Math.min(0, Math.max(W - W * k, tx));
    ty = Math.min(0, Math.max(H - H * k, ty));
  }
  function applyView() {
    clampView();
    world.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`);
    const u = 1 / (pxPerUnit() * k); // 1 pixel écran en unités carte
    document.getElementById("otherShape").style.strokeWidth = 0.8 * u;
    document.getElementById("mainShape").style.strokeWidth = 1.4 * u;
    document.getElementById("riverShape").style.strokeWidth = 1.2 * u;
    document.getElementById("insetShape").style.strokeWidth = 1.2 * u;
    P.forEach(c => {
      const e = els[c.id];
      if (c.zone) {
        const s = 11 * u;
        e.dot.setAttribute("x", c.x - s / 2); e.dot.setAttribute("y", c.y - s / 2);
        e.dot.setAttribute("width", s); e.dot.setAttribute("height", s); e.dot.setAttribute("rx", 1.5 * u);
      } else e.dot.setAttribute("r", 5.5 * u);
      e.dot.style.strokeWidth = 1.6 * u;
      e.ring.setAttribute("r", 11 * u); e.ring.style.strokeWidth = 2.5 * u;
      e.t.style.fontSize = 15 * u + "px"; e.t.style.strokeWidth = 3.5 * u;
    });
    if (k !== placedK) placeLabels();
  }
  function zoomAt(factor, sx, sy) {
    const nk = Math.max(1, Math.min(KMAX, k * factor)), f = nk / k;
    tx = sx - (sx - tx) * f; ty = sy - (sy - ty) * f; k = nk;
    applyView();
  }
  function clientToSvg(cx, cy) {
    const r = svg.getBoundingClientRect(), p = pxPerUnit();
    return [(cx - r.left - (r.width - W * p) / 2) / p, (cy - r.top - (r.height - H * p) / 2) / p];
  }
  function centerOn(c) { if (k < 1.01) return; tx = W / 2 - c.x * k; ty = H / 2 - c.y * k; applyView(); }

  // ---- Étiquettes : on essaie plusieurs positions autour du point et on garde la première libre ----
  const widthCache = new Map();
  function textWidth(s) { // largeur en pixels écran, pour une police de 15px
    if (!widthCache.has(s)) { measureEl.textContent = s; widthCache.set(s, measureEl.getComputedTextLength()); }
    return widthCache.get(s);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { widthCache.clear(); placeLabels(); });
  const ORDER = ["r", "l", "b", "t", "tr", "br", "tl", "bl"];
  function placeLabels() {
    placedK = k;
    const u = 1 / (pxPerUnit() * k), h = 15 * u, off = 9 * u, dr = 6 * u;
    const dots = P.map(c => [c.x - dr, c.y - dr, c.x + dr, c.y + dr, c.id]);
    // Les boutons de zoom recouvrent la carte : aucune étiquette ne doit passer dessous.
    const zr = document.querySelector(".zoom").getBoundingClientRect();
    const [zx0, zy0] = clientToSvg(zr.left - 4, zr.top - 4), [zx1, zy1] = clientToSvg(zr.right + 4, zr.bottom + 4);
    const placed = [[(zx0 - tx) / k, (zy0 - ty) / k, (zx1 - tx) / k, (zy1 - ty) / k]];
    const overlap = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    [...P].sort((a, b) => (a.prio ?? a.id) - (b.prio ?? b.id)).forEach(c => {
      const e = els[c.id], s = e.t.textContent;
      if (!s) return;
      const w = textWidth(s) * u;
      const pref = c.side || "r";
      const sides = c.sides || [pref, ...ORDER.filter(o => o !== pref)];
      let best = null;
      for (const sd of sides) {
        let x0;
        if (sd === "r" || sd === "tr" || sd === "br") x0 = c.x + off;
        else if (sd === "l" || sd === "tl" || sd === "bl") x0 = c.x - off - w;
        else x0 = c.x - w / 2;
        let cy;
        if (sd === "t") cy = c.y - off - h / 2;
        else if (sd === "b") cy = c.y + off + h / 2;
        else if (sd[0] === "t") cy = c.y - off * 0.8 - h / 2 + 2 * u;
        else if (sd[0] === "b") cy = c.y + off * 0.8 + h / 2 - 2 * u;
        else cy = c.y;
        const box = [x0, cy - h / 2, x0 + w, cy + h / 2];
        let score = 0;
        placed.forEach(b => score += overlap(box, b));
        dots.forEach(d => { if (d[4] !== c.id) score += overlap(box, d); });
        score += (w * h - overlap(box, [0, 0, W, H])) * 10;
        if (!best || score < best.score) best = { score, x0, cy, box };
        if (score === 0) break;
      }
      placed.push(best.box);
      e.t.setAttribute("x", best.x0); e.t.setAttribute("y", best.cy);
      e.t.setAttribute("text-anchor", "start"); e.t.setAttribute("dominant-baseline", "central");
    });
  }

  // ---- Gestes : déplacer, pincer, toucher un point ----
  document.getElementById("zin").onclick = () => zoomAt(1.6, W / 2, H / 2);
  document.getElementById("zout").onclick = () => zoomAt(1 / 1.6, W / 2, H / 2);
  document.getElementById("zreset").onclick = () => { k = 1; tx = 0; ty = 0; applyView(); };
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const [sx, sy] = clientToSvg(e.clientX, e.clientY);
    zoomAt(Math.exp(-e.deltaY * 0.0018), sx, sy);
  }, { passive: false });

  function nearestPoint(cx, cy) {
    const [sx, sy] = clientToSvg(cx, cy);
    const wx = (sx - tx) / k, wy = (sy - ty) / k;
    let best = null, bestD = 17 / (pxPerUnit() * k);
    P.forEach(c => { const d = Math.hypot(c.x - wx, c.y - wy); if (d <= bestD) { bestD = d; best = c.id; } });
    return best;
  }
  const pointers = new Map();
  let moved = false, downTarget = null, pinch = null, start = null, pendingTap = null;
  svg.addEventListener("pointerdown", e => {
    svg.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 1) {
      moved = false; downTarget = nearestPoint(e.clientX, e.clientY);
      start = { x: e.clientX, y: e.clientY, tx, ty };
    } else if (pointers.size === 2) {
      moved = true; downTarget = null;
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k, tx, ty, mid: clientToSvg((a[0] + b[0]) / 2, (a[1] + b[1]) / 2) };
    }
  });
  svg.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    const p = pxPerUnit();
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const mid = clientToSvg((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      const wx = (pinch.mid[0] - pinch.tx) / pinch.k, wy = (pinch.mid[1] - pinch.ty) / pinch.k;
      k = Math.max(1, Math.min(KMAX, pinch.k * d / pinch.d)); tx = mid[0] - wx * k; ty = mid[1] - wy * k; applyView();
    } else if (pointers.size === 1 && start) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) > 6) { moved = true; svg.classList.add("dragging"); }
      if (moved) { tx = start.tx + dx / p; ty = start.ty + dy / p; applyView(); }
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      svg.classList.remove("dragging");
      // La sélection se fait au "click" : sur téléphone, c'est le seul geste qui autorise le focus du champ (et donc le clavier).
      pendingTap = !moved && downTarget && e.type === "pointerup" ? downTarget : null;
      start = null; pinch = null; downTarget = null;
    } else if (pointers.size === 1) {
      pinch = null;
      const [only] = [...pointers.values()];
      start = { x: only[0], y: only[1], tx, ty };
    }
  }
  svg.addEventListener("pointerup", endPointer);
  svg.addEventListener("pointercancel", endPointer);
  svg.addEventListener("click", () => { if (pendingTap != null) { const id = pendingTap; pendingTap = null; select(id); } });
  new ResizeObserver(() => { placedK = null; applyView(); }).observe(svg);

  // ---- Correction ----
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/\bst\b/g, "saint").replace(/\bste\b/g, "sainte").replace(/[^a-z]/g, "");
  function lev(a, b) {
    const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function grade(c, typed) {
    const t = typed.trim().replace(/\s+/g, " ");
    if (t === c.name || (c.alts || []).includes(t)) return "ok";
    const nt = norm(t);
    if (!nt) return "bad";
    // La réponse la plus proche de ce qui a été écrit, sur cette carte : si c'est la bonne et que l'écart reste petit, c'est une faute d'orthographe.
    let best = null, bestD = Infinity, bestN = "";
    P.forEach(o => [o.name, ...(o.alts || [])].forEach(n => {
      const d = lev(nt, norm(n)); if (d < bestD) { bestD = d; best = o; bestN = norm(n); }
    }));
    const tol = Math.max(1, Math.floor(bestN.length / 3));
    return best.id === c.id && bestD <= tol ? "warn" : "bad";
  }

  // ---- Interface ----
  function render() {
    const filled = P.filter(c => (M.answers[c.id] || "").trim()).length;
    document.getElementById("count").textContent = `${filled} / ${P.length} ${M.unit}`;
    document.getElementById("barfill").style.width = (filled / P.length * 100) + "%";
    const vb = document.getElementById("validateBtn");
    vb.disabled = filled < P.length;
    vb.textContent = M.validated ? "Revalider" : "Valider";
    document.getElementById("legend").hidden = !M.validated;
    P.forEach(c => {
      const e = els[c.id], val = (M.answers[c.id] || "").trim(), r = M.results[c.id];
      e.dot.setAttribute("class", "dot " + (c.zone ? "zone " : "") + (r ? r : val ? "" : "empty"));
      e.t.textContent = val;
      e.t.setAttribute("class", "lbl " + (r || ""));
      e.ring.style.display = current === c.id ? "" : "none";
    });
    placeLabels();
  }
  function select(id) {
    current = id;
    const c = P.find(p => p.id === id);
    input.value = M.answers[id] || "";
    input.placeholder = c.zone ? "Nom de la région" : "Nom de la ville";
    editor.hidden = false;
    render();
    centerOn(c);
    input.focus({ preventScroll: true });
  }
  function commit() {
    if (current == null || !M) return;
    const v = input.value.trim().replace(/\s+/g, " ");
    if (v !== (M.answers[current] || "")) {
      if (v) M.answers[current] = v; else delete M.answers[current];
      delete M.results[current]; save(M);
    }
  }
  function close() { current = null; editor.hidden = true; input.blur(); render(); }

  editor.addEventListener("submit", e => { e.preventDefault(); commit(); close(); });
  input.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  // Quitter le champ enregistre la saisie, comme un appui sur OK.
  input.addEventListener("blur", () => { if (current != null) { commit(); close(); } });

  document.getElementById("validateBtn").onclick = () => {
    commit(); current = null; editor.hidden = true;
    M.results = {};
    P.forEach(c => { M.results[c.id] = grade(c, M.answers[c.id] || ""); });
    M.validated = true; render();
    showResult();
  };
  function showResult() {
    const n = { ok: 0, warn: 0, bad: 0 };
    Object.values(M.results).forEach(r => n[r]++);
    document.getElementById("nOk").textContent = n.ok;
    document.getElementById("nWarn").textContent = n.warn;
    document.getElementById("nBad").textContent = n.bad;
    const perfect = n.ok === P.length;
    document.getElementById("bravo").hidden = !perfect;
    document.getElementById("resultTitle").textContent = perfect ? M.allOk : `${n.ok} / ${P.length} ${M.unit} justes`;
    document.getElementById("resultMsg").textContent = perfect
      ? "Aucune faute, la carte est parfaite."
      : "Corrige les points jaunes et rouges sur la carte, puis valide à nouveau.";
    overlay.hidden = false;
    document.getElementById("resultClose").focus();
  }
  const closeResult = () => { overlay.hidden = true; };
  document.getElementById("resultClose").onclick = closeResult;
  overlay.addEventListener("click", e => { if (e.target === overlay) closeResult(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) closeResult(); });
  document.getElementById("clearBtn").onclick = () => { confirmBox.hidden = false; };
  document.getElementById("confirmNo").onclick = () => { confirmBox.hidden = true; };
  document.getElementById("confirmYes").onclick = () => {
    M.answers = {}; M.results = {}; M.validated = false; save(M); confirmBox.hidden = true; close();
  };

  // ---- Choix de la carte (#france ou #royaume-uni dans l'adresse) ----
  document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
    confirmBox.hidden = true;
    if (location.hash !== "#" + b.dataset.map) location.hash = b.dataset.map; else loadMap(b.dataset.map);
  }));
  const fromHash = () => loadMap(MAPS[location.hash.slice(1)] ? location.hash.slice(1) : "france");
  window.addEventListener("hashchange", () => { confirmBox.hidden = true; fromHash(); });
  fromHash();
})();
</script>
</body>
</html>
